<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BetterTrade</title>
    <!-- ⚠️ L'ICONA dal 1/11/2026 (Mattia: *"voglio vederla sui browser e sul
         telefono quando aggiungo alla Home"*), nei file di `public/`:
         · la scheda del browser porta **solo la B** (`favicon-*`, `favicon.ico`):
           a 16-32 px la scritta «BetterTrade» sarebbe una riga illeggibile;
         · la Home di iPhone (`apple-touch-icon.png`, 180 px) e di Android
           (`manifest.webmanifest`, 192 e 512) portano il **logo intero**.
         ⚠️ Esiste anche `favicon.ico`: il browser lo chiede da solo, e senza
         si prendeva un 404 su ogni pagina (21/10/2026, quando il marchio era un
         SVG scritto qui dentro proprio per evitarlo).
         ⚠️ Si rifanno da `grafica/logo.png` con `python3 scripts/icone.py`. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-title" content="BetterTrade" />
    <meta name="theme-color" content="#0B0D10" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <!-- ⚠️ Tre pesi di Sora, non cinque (21/10/2026). Il **300 non lo usava
         nessuno**, e il **500 era usato 5 volte su 149**: tolti, sono due file
         in meno da scaricare. ⚠️ E `fontWeight: 800` era usato 5 volte **senza
         che l'800 fosse caricato**, quindi il browser se lo inventava
         ingrassando il 700 — una finta grassetta, più brutta e più lenta da
         disegnare. Quei cinque punti ora dicono 700. -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
